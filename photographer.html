<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fisheye - photographe</title>
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <a href="index.html" aria-label="Retour à la page d'accueil">
        <img src="assets/images/logo.png" class="logo" alt="Logo Fisheye" />
      </a>
    </header>

    <main id="main">
      <section class="photograph-header"></section>
      <div class="media-filter">
        <span id="sort-label">Trier par :</span>
        <div class="custom-select-wrapper">
          <div
            class="custom-select-trigger"
            id="sort-trigger"
            tabindex="0"
            role="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="sort-options-list"
            aria-labelledby="sort-label sort-trigger-text"
          >
            <span class="trigger-text" id="sort-trigger-text"></span>
            <img
              src="assets/icons/arrow-down.svg"
              alt="Flèche vers le bas"
              class="arrow-icon"
            />
          </div>

          <ul
            class="custom-options-list"
            id="sort-options-list"
            role="listbox"
            aria-hidden="true"
          >
            <li
              class="custom-option selected"
              data-value="popularity"
              role="option"
              aria-selected="true"
              tabindex="0"
            >
              Popularité
            </li>
            <hr class="margehr" />
            <li
              class="custom-option"
              data-value="date"
              role="option"
              tabindex="-1"
            >
              Date
            </li>
            <hr class="margehr" />
            <li
              class="custom-option"
              data-value="title"
              role="option"
              tabindex="-1"
            >
              Titre
            </li>
          </ul>
        </div>
      </div>

      <section class="media-gallery"></section>

      <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true"
        role="dialog"
        tabindex="-1"
        aria-modal="true"
      >
        <button class="lightbox-close" aria-label="Fermer la lightbox">
          ✖
        </button>
        <button class="lightbox-prev" aria-label="Média précédent">❮</button>
        <div class="lightbox-content"></div>
        <button class="lightbox-next" aria-label="Média suivant">❯</button>
      </div>
    </main>

    <div id="contact_modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-labelledby="contact-title">
        <header>
          <h1 id="contact-title">
            Contactez-moi <br />
            <span id="photographer-contact-name"></span>
          </h1>
          <img
            src="assets/icons/close.svg"
            onclick="closeModal()"
            alt="Fermer la modale"
          />
        </header>
        <form onsubmit="submitForm(event)">
          <div>
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" required />
          </div>
          <div>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="message">Votre message</label>
            <textarea id="message" name="message" rows="4" required></textarea>
          </div>
          <button class="contact_button" type="submit">Envoyer</button>
        </form>
      </div>
    </div>

    <div class="photographer-stats">
      <span class="total-likes"></span> <span class="price-per-day"></span>
    </div>

    <script src="scripts/utils/contactForm.js"></script>

    <script type="module" src="scripts/pages/photographer.js"></script>
  </body>
</html>
